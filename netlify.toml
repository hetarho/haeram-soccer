[build]
  base = "."
  command = "npm ci && npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24.12.0"

[context.production]
  command = "npm ci && npm run build"

[context.deploy-preview]
  command = "npm ci && npm run build"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false
