[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24.12.0"

[context.production]
  command = "pnpm install --frozen-lockfile && pnpm run build"

[context.deploy-preview]
  command = "pnpm install --frozen-lockfile && pnpm run build"

[dev]
  command = "pnpm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false
