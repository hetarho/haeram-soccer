[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "apps/web/dist"

[context.production]
  command = "pnpm install --frozen-lockfile && pnpm run build"

[context.deploy-preview]
  command = "pnpm install --frozen-lockfile && pnpm run build"

[dev]
  command = "pnpm run dev"
  targetPort = 19500
  port = 8888
  autoLaunch = false
