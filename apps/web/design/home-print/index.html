<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>매치데이 인쇄 · 홈 화면</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #22231e;
        color: #f1e5cc;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        padding: 18px 24px;
        border-bottom: 1px solid #716b59;
      }
      h1 {
        margin: 0 auto 0 0;
        font-size: 18px;
      }
      nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button,
      a {
        display: inline-block;
        min-height: 40px;
        padding: 9px 14px;
        border: 1px solid #716b59;
        border-radius: 3px;
        color: inherit;
        background: transparent;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      button[aria-pressed='true'],
      a {
        background: #a63724;
        border-color: #c67256;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #f1e5cc;
        outline-offset: 3px;
      }
      main {
        padding: 24px;
      }
      figure {
        margin: 0 auto;
        max-width: 1536px;
      }
      figure.phone {
        max-width: 390px;
      }
      figcaption {
        margin-bottom: 12px;
        color: #d5c7aa;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        box-shadow: 0 10px 40px #0005;
      }
      #second {
        margin-top: 20px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 600px) {
        header,
        main {
          padding: 12px;
        }
        h1 {
          flex-basis: 100%;
        }
        button,
        a {
          padding: 8px 10px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>매치데이 인쇄 · 홈 화면</h1>
      <nav aria-label="화면 비교">
        <button type="button" data-view="desktop" aria-pressed="true">구현 화면</button>
        <button type="button" data-view="reference" aria-pressed="false">원본 시안</button>
        <button type="button" data-view="mobile" aria-pressed="false">모바일</button>
        <button type="button" data-view="report" aria-pressed="false">경기 준비 보고</button>
        <button type="button" data-view="tablet" aria-pressed="false">태블릿</button>
      </nav>
      <a href="./screens.html">전체 화면 보기</a>
      <a href="/" id="play">게임에서 보기 ↗</a>
    </header>
    <main>
      <figure>
        <figcaption id="caption">실제 게임 홈 · 1536 × 1024</figcaption>
        <img
          id="screen"
          src="./captures/desktop.webp"
          alt="매치데이 인쇄 테마의 실제 게임 홈 화면"
        />
        <img
          id="second"
          src="./captures/mobile-bottom.webp"
          alt="모바일 홈 화면을 아래로 스크롤한 모습"
          hidden
        />
      </figure>
    </main>
    <script>
      const views = {
        desktop: ['./captures/desktop.webp', '실제 게임 홈 · 1536 × 1024'],
        reference: ['../home-themes/captures/print.png', '원본 매치데이 인쇄 시안'],
        mobile: ['./captures/mobile.webp', '실제 게임 홈 · 390 × 844 · 위 / 아래 스크롤'],
        report: ['./captures/match-report-390.webp', '경기 준비 보고 · 모바일 바텀시트'],
        tablet: ['./captures/tablet.webp', '실제 게임 홈 · 820 × 1180'],
      };
      for (const button of document.querySelectorAll('[data-view]')) {
        button.addEventListener('click', () => {
          for (const choice of document.querySelectorAll('[data-view]'))
            choice.setAttribute('aria-pressed', String(choice === button));
          const [source, caption] = views[button.dataset.view];
          document.querySelector('#screen').src = source;
          document.querySelector('#caption').textContent = caption;
          document
            .querySelector('figure')
            .classList.toggle('phone', ['mobile', 'report'].includes(button.dataset.view));
          document.querySelector('#second').hidden = button.dataset.view !== 'mobile';
        });
      }
      document.querySelector('#play').addEventListener('click', () => {
        try {
          const key = 'haeram-soccor:presentation';
          const preferences = JSON.parse(localStorage.getItem(key) || '{}');
          localStorage.setItem(key, JSON.stringify({ ...preferences, themeId: 'matchday-print' }));
        } catch {
          // The game's settings remain available when browser preference storage is denied.
        }
      });
    </script>
  </body>
</html>
