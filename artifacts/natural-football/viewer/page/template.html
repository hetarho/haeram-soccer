<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  /* Layout: four broadcast monitors in a 2×2 control-room grid over one shared transport bar. */
  :root {
    --bg: #eef1ee;
    --surface: #ffffff;
    --fg: #16201b;
    --muted: #5b6a62;
    --line: #d3dbd5;
    --accent: #1f6f4a;
    --accent-ink: #ffffff;
    --goal: #b8860b;
    --goal-ink: #1a1405;
    --error: #b42318;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1512; --surface: #17201b; --fg: #e6ece8; --muted: #93a39a; --line: #2a3630;
      --accent: #5cc48d; --accent-ink: #0b1510; --goal: #e8c15a; --goal-ink: #1a1405; --error: #f97066;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1512; --surface: #17201b; --fg: #e6ece8; --muted: #93a39a; --line: #2a3630;
    --accent: #5cc48d; --accent-ink: #0b1510; --goal: #e8c15a; --goal-ink: #1a1405; --error: #f97066;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 var(--font-body);
  }
  .wrap {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px 0;
    display: grid;
    gap: 12px;
    /* Two rows of panels plus the bars fit one screen on a laptop; never under 760 px wide. */
    --panel-w: calc(((100dvh - 290px) / 2 - 66px) * 1.9);
    max-width: max(760px, min(100%, calc(var(--panel-w) * 2 + 44px)));
    margin-inline: auto;
  }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
  #status { color: var(--muted); min-width: 0; }
  #status.error { color: var(--error); }
  #grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .panel {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 8px 6px;
    display: grid;
    gap: 6px;
    transition: border-color 160ms;
  }
  .panel.goal { border-color: var(--goal); }
  .panel-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .tag {
    font: 600 13px/1 var(--font-data);
    background: var(--fg); color: var(--bg);
    padding: 3px 7px; border-radius: 3px; flex: none;
  }
  .caption { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .board {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    align-items: center;
    gap: 8px;
    font-family: var(--font-data);
    font-variant-numeric: tabular-nums;
  }
  .side { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .side.home { justify-content: flex-end; }
  .team { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
  .score { display: flex; gap: 4px; font-size: 18px; }
  .score b { min-width: 1.2ch; text-align: center; padding: 0 3px; border-radius: 3px; }
  .score b.scored { background: var(--goal); color: var(--goal-ink); }
  .dash { color: var(--muted); }
  .clock { justify-self: end; min-width: 9ch; text-align: right; color: var(--muted); }
  .stage { position: relative; }
  .stage canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 1.9; border-radius: 3px; }
  .note, .flash {
    position: absolute;
    font: 600 12px/1.3 var(--font-body);
    padding: 3px 8px;
    border-radius: 3px;
    max-width: calc(100% - 16px);
  }
  .note { left: 8px; bottom: 8px; background: rgba(10, 16, 13, 0.78); color: #f1f0e8; }
  .flash { left: 50%; top: 8px; transform: translateX(-50%); background: var(--goal); color: var(--goal-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-foot { color: var(--muted); font: 11px/1.3 var(--font-data); overflow-wrap: anywhere; }
  .transport {
    position: sticky;
    bottom: 0;
    z-index: 5;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  button {
    font: 600 13px/1 var(--font-body);
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 12px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #play { min-width: 92px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .speeds { display: flex; align-items: center; gap: 4px; }
  .speeds .label, .seek .label { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .chip { font-family: var(--font-data); padding: 7px 9px; }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .seek { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-width: 0; }
  #seek { flex: 1; min-width: 0; accent-color: var(--accent); }
  #minute { font: 600 14px/1 var(--font-data); font-variant-numeric: tabular-nums; min-width: 6ch; text-align: right; }
  #mode[aria-pressed="true"] { border-color: var(--goal); }
  #build { color: var(--muted); font: 11px/1.3 var(--font-data); flex-basis: 100%; }
  @media (max-width: 700px) {
    #grid { grid-template-columns: minmax(0, 1fr); }
    .wrap { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
<div class="wrap">
  <div class="top">
    <h1>__HEADING__</h1>
    <span id="status">경기 데이터를 불러오는 중…</span>
  </div>
  <main id="grid" aria-label="변형별 경기장"></main>
  <div class="transport" role="group" aria-label="공통 재생 조작">
    <button id="play" type="button" aria-pressed="false" disabled>재생</button>
    <div class="speeds" id="speeds"><span class="label">배속</span></div>
    <label class="seek" for="seek"><span class="label">분</span>
      <input id="seek" type="range" min="0" max="0" step="1" value="0" disabled>
      <output id="minute" for="seek">0′</output>
    </label>
    <button id="mode" type="button" aria-pressed="false" title="공통 시계: 네 패널이 같은 순간을 보여 줌 (데드볼은 모든 패널이 데드볼일 때만 빨라짐). 각자 시계: 패널마다 게임과 똑같은 시계.">공통 시계</button>
    <span id="build"></span>
  </div>
</div>
<script type="application/json" id="viewer-config">__CONFIG__</script>
