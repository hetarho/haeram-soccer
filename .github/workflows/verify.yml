name: Verify web game
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'spec/**'
      - 'artifacts/**'
      - '**.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # main keeps a started run so every code push to main gets a result while parallel sessions push;
  # GitHub still replaces older pending runs with the newest one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# CI runs only the three Chromium browser shards, each with a 120-minute limit, so a hung run fails
# instead of holding main's run queue for the platform's six hours. Type/lint/format, contract, catalog,
# presentation, i18n, unit, integration and the production build run once in the batch gate before the
# push (ARCH-30), not on CI. The benchmarks run on demand in benchmark.yml.
jobs:
  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Playwright splits Chromium journeys by file, so the three shards run separate shares.
          - { browser: chromium, shard: 1/3, slug: chromium-1 }
          - { browser: chromium, shard: 2/3, slug: chromium-2 }
          - { browser: chromium, shard: 3/3, slug: chromium-3 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run build
      # The simulated worlds the journeys set up (tests/fixtures/worlds.ts), as in the integration jobs.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/haeram-worlds
          key: haeram-worlds-e2e-${{ matrix.slug }}-${{ github.sha }}
          restore-keys: haeram-worlds-e2e-${{ matrix.slug }}-
      - run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
        env:
          PREVIEW_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.slug }}
          include-hidden-files: true
          path: |
            playwright-report
            test-results
            .tmp/release-storage-failure-metrics.json
            .tmp/verification/e2e-results.json
