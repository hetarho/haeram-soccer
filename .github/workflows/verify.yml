name: Verify web game
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'spec/**'
      - 'artifacts/**'
      - '**.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # main keeps a started run so every code push to main gets a result while parallel sessions push;
  # GitHub still replaces older pending runs with the newest one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# The checks, fast units, three integration shards and two shards per browser (Chromium, Firefox, WebKit)
# run as parallel jobs: the run takes as long as its slowest job instead of the sum of every step. Every
# job has a time limit (checks and unit 20 min, integration 45 min, browser shards 120 min), so a hung run
# fails instead of holding main's run queue for the platform's six hours. The benchmarks run on demand in
# benchmark.yml.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test:contract
      - run: pnpm run validate:catalogs
      - run: pnpm run validate:presentation
      - run: pnpm run validate:i18n
      - run: pnpm run build

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit --reporter=default --reporter=json --outputFile=.tmp/unit-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          include-hidden-files: true
          path: .tmp/unit-results.json

  integration:
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1/3, slug: '1' }
          - { shard: 2/3, slug: '2' }
          - { shard: 3/3, slug: '3' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Simulated test worlds (tests/fixtures/worlds.ts) keyed by the source tree: a run whose
      # engine did not change reads them instead of simulating again.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/haeram-worlds
          key: haeram-worlds-integration-${{ matrix.slug }}-${{ github.sha }}
          restore-keys: haeram-worlds-integration-${{ matrix.slug }}-
      - run: pnpm run test:integration --shard=${{ matrix.shard }} --reporter=default --reporter=json --outputFile=.tmp/integration-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ matrix.slug }}
          include-hidden-files: true
          path: .tmp/integration-results.json

  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two shards per browser: Playwright splits the journeys by file, so each shard runs about
          # half of them with the same retries.
          - { browser: chromium, shard: 1/2, slug: chromium-1 }
          - { browser: chromium, shard: 2/2, slug: chromium-2 }
          - { browser: firefox, shard: 1/2, slug: firefox-1 }
          - { browser: firefox, shard: 2/2, slug: firefox-2 }
          - { browser: webkit, shard: 1/2, slug: webkit-1 }
          - { browser: webkit, shard: 2/2, slug: webkit-2 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run build
      - run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
        env:
          PREVIEW_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.slug }}
          include-hidden-files: true
          path: |
            playwright-report
            test-results
            .tmp/release-storage-failure-metrics.json
            .tmp/verification/e2e-results.json
